<!doctype html>
<html lang ="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull Workout | Liftlog</title>
  </head>

  <body>
    <main>
      <h1> Pull Workout</h1>
      <ul>
        {% for exercise in exercises %}
          <li>{{ exercise["name"] }}</li>
        {% else %}
          <li>No exercises added yet.</li>
        {% endfor %}
      </ul>
      <form action="{{ url_for('add_pull_exercise') }}" method="post">
        <label for="exercise-name">Exercise name</label>

        <input
          type="text"
          id="exercise-name"
          name="exercise_name"
          placeholder="Example: Barbell Row"
          required
        >
        <button type="submit">Add exercise</button>
      </form>

      <p>Track your back and biceps workouts.</p>
      <a href="{{ url_for('home') }}">Back to home</a>
    </main>
  </body>
</html>
