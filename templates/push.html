<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Workout | Liftlog</title>
  </head>

  <body>
    <main>
      <h1> Push Workout</h1>
      <ul>
        {% for exercise in exercises %}
          <li>{{ exercise }}</li>
        {% endfor %}
      </ul>
      <form action="{{ url_for('add_push_exercise') }}" method="post">
        <label for="exercise-name">Exercise name</label>

        <input
          type="text"
          id="exercise-name"
          name="exercise_name"
          placeholder="Example: Cable Fly"
          required
          >

        <button type="submit">Add exercise</button>
      </form>
      <p>Track your chest, shoulders, and triceps workouts.</p>
      <a href="{{ url_for('home') }}">Back to home</a>
    </main>
  </body>
</html>
