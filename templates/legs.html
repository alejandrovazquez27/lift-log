<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Log - Push</title>
  </head>  

  <body>
    <main>
      <h1>Legs Workout</h1>
      <ul>
        {% for exercise in exercises %}
          <li>{{ exercise }}</li>
        {% endfor %}
      </ul>
      <form action="{{ url_for('add_leg_exercise') }}" method="post">
        <label for = "exercise-name">Exercise name</label>
        <input
          type="text"
          id="exercise_name"
          name="exercise_name"
          placeholder="Example: Squat"
          required
        >
        <button type="submit">Add exercise</button>
      </form>
      <p>Track your leg workouts.</p>
      <a href="{{ url_for('home') }}">Back to home</a>
    </main>
  </body>
</html>
